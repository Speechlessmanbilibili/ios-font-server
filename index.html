<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iOS 字体安装</title>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; max-width: 42em; margin: 2em auto; padding: 0 1em; line-height: 1.6; }
  h1 { font-size: 1.4em; }
  h2 { font-size: 1.1em; margin-top: 1.8em; }
  a.btn { display: block; text-align: center; background: #0a84ff; color: #fff; padding: 0.7em; border-radius: 10px; text-decoration: none; margin: 0.6em 0; }
  a.btn.small { background: #34c759; }
  .chips { margin: 0.6em 0; }
  .chips button { background: #f2f2f7; border: 1px solid #d1d1d6; border-radius: 16px; padding: 0.3em 0.8em; margin: 0.15em; font-size: 0.85em; }
  .chips button.active { background: #0a84ff; color: #fff; border-color: #0a84ff; }
  .fontlist { columns: 2; column-gap: 1.5em; font-size: 0.9em; }
  .fontlist label { display: block; padding: 0.2em 0; }
  .fontlist input { margin-right: 0.4em; }
  .meta { color: #8e8e93; font-size: 0.8em; }
  ol { padding-left: 1.4em; }
  .note { background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px; padding: 0.8em 1em; }
</style>
</head>
<body>
<h1>iOS 字体安装</h1>

<p>四个家族各用一个独立描述文件，每个文件内含 9 个正体与 9 个斜体静态字体。</p>

<h2>📦 家族独立包（推荐）</h2>
<div id="family-links">加载中…</div>

<h2>🎯 自定义选择</h2>
<div class="chips">
  <button onclick="check('all')">全选</button>
  <button onclick="check('none')">全不选</button>
  <button onclick="check('hanlink')">仅 Hanlink</button>
  <button onclick="check('bridge')">仅 CJK Punct</button>
  <button onclick="check('interrobang')">仅 ?! 变体</button>
  <button onclick="check('upright')">仅正体</button>
  <button onclick="check('italic')">仅斜体</button>
</div>
<div class="fontlist" id="fontlist">加载中…</div>
<a class="btn" href="javascript:void(0)" onclick="downloadSelected()" id="custom-btn" style="background:#ff9500">⬇️ 生成并下载所选字体</a>
<p class="meta" id="custom-meta"></p>

<h2>安装步骤</h2>
<ol>
  <li>点击上方按钮下载描述文件（Safari 会提示下载配置描述文件）。</li>
  <li>打开「设置」→「已下载描述文件」→ 安装。</li>
  <li>安装后在「设置 → 通用 → 字体」启用对应字体。</li>
</ol>

<h2>已生成的分组包（服务器预生成，直接下载）</h2>
<div id="pair-links">加载中…</div>

<script>
let FONTS = [];
const FAMILIES = [
  { key: 'HanlinkSans', label: '📦 Hanlink Sans 全家桶', desc: '标准版 · 中英混排正文字体' },
  { key: 'CJKPunctBridge', label: '📦 CJK Punct Bridge 全家桶', desc: '标点桥接标准版' },
  { key: 'HanlinkSansInterrobang', label: '‽ Hanlink ?! 变体', desc: '?!/!?→‽ 连字版' },
  { key: 'CJKPunctBridgeInterrobang', label: '‽ CJK Punct Bridge ?! 变体', desc: '?!/!?→‽ 连字版' },
];

async function load() {
  try {
    const r = await fetch('./fonts.json');
    FONTS = await r.json();
    const box = document.getElementById('fontlist');
    box.innerHTML = FONTS.map(f =>
      `<label><input type="checkbox" value="${f.name}" checked onchange="updateMeta()"> ${f.display} <span class="meta">(${(f.size/1048576).toFixed(1)}MB)</span></label>`
    ).join('');
    updateMeta();
    // 家族独立包：预定义顺序，从 profiles.json 匹配实际文件与大小
    try {
      const pr = await fetch('./profiles.json');
      const profiles = await pr.json();
      const byName = Object.fromEntries(profiles.map(p => [p.name, p]));
      const famBox = document.getElementById('family-links');
      famBox.innerHTML = FAMILIES.map(f => {
        const p = byName[`${f.key}.mobileconfig`];
        if (!p) return '';
        const mb = (p.size/1048576).toFixed(1);
        return `<a class="btn" href="./profiles/${encodeURIComponent(p.name)}">${f.label}（${mb}MB）<br><span style="font-size:0.8em;opacity:0.85">${f.desc}</span></a>`;
      }).join('') || '（未找到预生成描述文件，可在服务器上运行 python generate_profile.py）';
      // 其余预生成包（两两配对等）
      const extra = profiles.filter(p => !FAMILIES.some(f => `${f.key}.mobileconfig` === p.name));
      document.getElementById('pair-links').innerHTML = extra.map(p =>
        `<a class="btn small" href="./profiles/${encodeURIComponent(p.name)}">${p.name.replace('.mobileconfig','')}（${(p.size/1048576).toFixed(1)}MB）</a>`
      ).join('') || '（暂无其他分组包）';
    } catch (e) {
      document.getElementById('family-links').innerHTML = '描述文件列表加载失败：' + e;
    }
  } catch (e) {
    document.getElementById('fontlist').innerHTML = '字体列表加载失败：' + e;
  }
}

function selected() {
  return [...document.querySelectorAll('#fontlist input:checked')].map(i => i.value);
}

function check(kind) {
  document.querySelectorAll('#fontlist input').forEach(i => {
    const f = FONTS.find(x => x.name === i.value);
    let on = true;
    if (kind === 'none') on = false;
    else if (kind === 'hanlink') on = f.display.startsWith('Hanlink');
    else if (kind === 'bridge') on = f.display.startsWith('CJK Punct');
    else if (kind === 'interrobang') on = f.display.includes('?!');
    else if (kind === 'upright') on = !/Italic$/.test(f.display) && !f.display.endsWith(' Italic');
    else if (kind === 'italic') on = /Italic/.test(f.display);
    i.checked = on;
  });
  updateMeta();
}

function updateMeta() {
  const n = selected().length;
  const sizeMB = FONTS.filter(f => selected().includes(f.name)).reduce((s, f) => s + f.size, 0) / 1048576;
  document.getElementById('custom-meta').textContent =
    `已选 ${n} 个字体，生成的描述文件约 ${sizeMB.toFixed(1)} MB`;
}

async function downloadSelected() {
  const fonts = selected();
  if (!fonts.length) { alert('请至少选择一个字体'); return; }
  const btn = document.getElementById('custom-btn');
  btn.textContent = '⏳ 正在生成…';
  try {
    const r = await fetch('./api/profile', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fonts, name: `自定义 ${fonts.length} 个字体` }),
    });
    if (!r.ok) { alert('生成失败：' + (await r.text())); return; }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'fonts.mobileconfig';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (e) {
    alert('生成失败：' + e);
  } finally {
    btn.textContent = '⬇️ 生成并下载所选字体';
  }
}

load();
</script>
</body>
</html>
